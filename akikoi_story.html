<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>秋恋ストーリー ―クボの文化祭―</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#120d22;overflow:hidden;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;color:#fff}
#root{position:fixed;inset:0;font-size:clamp(14px,2.5vmin,28px)}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20}
.screen.show{display:flex}
button{font:inherit;color:inherit;cursor:pointer;border:none}

/* ===== backgrounds ===== */
#game{position:absolute;inset:0;overflow:hidden;background:#222;user-select:none;cursor:pointer}
#game.flash::after{content:"";position:absolute;inset:0;background:#fff;animation:fl .6s forwards;z-index:30;pointer-events:none}
@keyframes fl{from{opacity:.9}to{opacity:0}}
.bg-class{background:linear-gradient(#cfeaff,#eaf7ff) 8% 10%/22% 30% no-repeat,linear-gradient(#cfeaff,#eaf7ff) 39% 10%/22% 30% no-repeat,linear-gradient(#cfeaff,#eaf7ff) 70% 10%/22% 30% no-repeat,linear-gradient(#f6e6c4 0 62%,#b98b5a 62% 100%)}
.bg-home{background:radial-gradient(circle at 75% 25%,#fff6c8 0 8%,transparent 9%),linear-gradient(#ffe9d2 0 65%,#d9b48a 65% 100%)}
.bg-gate{background:radial-gradient(circle at 10% 75%,#e07b39 0 12%,transparent 13%),radial-gradient(circle at 30% 80%,#d4a017 0 10%,transparent 11%),radial-gradient(circle at 70% 78%,#c0522b 0 13%,transparent 14%),radial-gradient(circle at 90% 74%,#e8a33d 0 11%,transparent 12%),linear-gradient(#a9d8ff 0 68%,#c8b790 68% 100%)}
.bg-aquarium{background:radial-gradient(ellipse at 30% 40%,rgba(120,220,255,.5),transparent 40%),radial-gradient(ellipse at 75% 55%,rgba(80,160,255,.45),transparent 45%),linear-gradient(#0a2a55,#0b4a80 60%,#06304f)}
.bg-sunset{background:radial-gradient(circle at 78% 55%,#fff1b0 0 7%,#ffb36b 8% 14%,transparent 15%),linear-gradient(#5b6ee1 0%,#f0869a 45%,#ffc18a 70%,#3b2f4a 70% 100%)}
.bg-festnight{background:radial-gradient(circle at 50% 78%,#ff9a3c 0 6%,rgba(255,120,40,.4) 7% 18%,transparent 30%),linear-gradient(#150f33,#3b1f5b 65%,#1a1230 65% 100%)}
.bg-library{background:repeating-linear-gradient(90deg,#6b4a2e 0 6%,#8a6240 6% 7%,#7a5535 7% 13%) 0 0/100% 62% no-repeat,linear-gradient(#e9d3b0 0 62%,#9c7248 62% 100%)}
.bg-council{background:linear-gradient(#10172e,#27345e) 62% 12%/28% 34% no-repeat,linear-gradient(#e7ecf5 0 60%,#8d94a8 60% 100%)}
.bg-town{background:linear-gradient(90deg,#f4b6b6 0 14%,#b6d4f4 14% 30%,#f4e3b6 30% 48%,#c9f4b6 48% 66%,#e0b6f4 66% 84%,#f4c9b6 84% 100%) 0 28%/100% 42% no-repeat,linear-gradient(#bfe6ff 0 70%,#8e949c 70% 100%)}
.bg-roof{background:radial-gradient(ellipse at 20% 25%,#fff 0 6%,transparent 7%),radial-gradient(ellipse at 28% 28%,#fff 0 7%,transparent 8%),radial-gradient(ellipse at 70% 18%,#fff 0 6%,transparent 7%),repeating-linear-gradient(90deg,transparent 0 3%,#5a6a78 3% 3.4%) 0 62%/100% 28% no-repeat,linear-gradient(#7cc4ff 0 70%,#9aa6b0 70% 100%)}
.bg-night{background:radial-gradient(circle at 80% 20%,#fffbd0 0 4%,rgba(255,250,200,.3) 5% 9%,transparent 10%),radial-gradient(circle at 15% 20%,#fff 0 .3%,transparent .5%),radial-gradient(circle at 35% 12%,#fff 0 .3%,transparent .5%),radial-gradient(circle at 55% 25%,#fff 0 .3%,transparent .5%),radial-gradient(circle at 90% 45%,#fff 0 .3%,transparent .5%),radial-gradient(circle at 25% 40%,#fff 0 .3%,transparent .5%),linear-gradient(#0b1030,#1f2b5e 70%,#141a3a 70% 100%)}
.bg-cafe{background:linear-gradient(#fff3dc,#fff3dc) 60% 10%/28% 30% no-repeat,linear-gradient(#f7e6d0 0 60%,#a8764a 60% 100%)}
.bg-art{background:linear-gradient(#e8a0a0,#a0c8e8) 12% 18%/12% 26% no-repeat,linear-gradient(#a0e8c0,#e8d8a0) 70% 22%/14% 24% no-repeat,linear-gradient(#f2efe9 0 62%,#c5b49a 62% 100%)}
.bg-fest{background:repeating-linear-gradient(90deg,transparent 0 5%,#ffd166 5% 5.8%,transparent 6% 11%,#ff6b9d 11% 11.8%) 0 6%/100% 2% no-repeat,linear-gradient(#ffd6a5,#ffadad 55%,#9d6b53 55% 100%)}

/* ===== chara / HUD ===== */
#chara{position:absolute;bottom:0;left:50%;transform:translateX(-50%);height:90%;pointer-events:none;transition:opacity .3s}
#chara svg{height:100%;width:auto;filter:drop-shadow(0 .5em .8em rgba(0,0,0,.35))}
#chara.talk svg{animation:bob .35s ease-out}
@keyframes bob{0%{transform:translateY(0)}40%{transform:translateY(-1.2%)}100%{transform:translateY(0)}}
#hud{position:absolute;top:2.5%;left:2%;display:flex;flex-direction:column;gap:.4em;z-index:5;pointer-events:none}
.gauge{display:flex;align-items:center;gap:.5em;font-size:.72em;text-shadow:0 1px 3px #000}
.gauge .bar{width:9em;height:.9em;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.5);border-radius:1em;overflow:hidden}
.gauge .bar i{display:block;height:100%;width:0;transition:width .6s}
#gLove i{background:linear-gradient(90deg,#ff7aa8,#ff3d77)}
#gRival i{background:linear-gradient(90deg,#7aa8ff,#3d4dff)}
#gDark i{background:linear-gradient(90deg,#9b59b6,#2c003e)}
#menu{position:absolute;top:2.5%;right:2%;display:flex;gap:.4em;z-index:6}
#menu button{background:rgba(20,10,40,.65);border:1px solid rgba(255,255,255,.4);border-radius:.6em;padding:.25em .7em;font-size:.7em}
#menu button.on{background:#ff4f8b}
#chTitle{position:absolute;inset:0;z-index:25;display:none;align-items:center;justify-content:center;background:rgba(10,5,25,.82);font-size:1.7em;letter-spacing:.15em;text-align:center;padding:1em}
#chTitle.show{display:flex;animation:fi .5s}
@keyframes fi{from{opacity:0}to{opacity:1}}
#textbox{position:absolute;left:3%;right:3%;bottom:3%;min-height:25%;background:rgba(20,12,45,.86);border:2px solid rgba(255,255,255,.4);border-radius:1em;padding:1.4em 1.4em 1em;z-index:8;box-shadow:0 .3em 1.2em rgba(0,0,0,.45)}
#name{position:absolute;left:1em;top:-1.1em;background:#ff4f8b;padding:.1em 1em;border-radius:.8em;font-weight:bold;display:none}
#name.k{background:#4b7bff}#name.r{background:#444a66}#name.t{background:#6c6f85}
#text{line-height:1.7;min-height:3.4em;white-space:pre-wrap}
#next{position:absolute;right:1em;bottom:.5em;animation:blink 1s infinite;visibility:hidden}
@keyframes blink{50%{opacity:.2}}
#choices{position:absolute;inset:0 0 28% 0;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;gap:.8em;padding:0 8%}
#choices.show{display:flex}
#choices button{width:min(46em,92%);background:linear-gradient(180deg,#ff8fb8,#e0408a);border:2px solid #fff;border-radius:2em;padding:.65em 1em;box-shadow:0 .2em .7em rgba(0,0,0,.4);font-weight:bold;transition:transform .12s}
#choices button:hover{transform:scale(1.03)}
.pop{animation:pop .6s}
@keyframes pop{30%{transform:scale(1.25)}}

/* ===== screens ===== */
#titleScr{background:radial-gradient(circle at 50% 30%,#ff8fb8 0,#7b3fa8 45%,#1a0f3a 100%)}
#titleScr h1{font-size:2.6em;text-align:center;line-height:1.3;text-shadow:0 .1em .4em rgba(0,0,0,.5);letter-spacing:.08em}
#titleScr h1 small{display:block;font-size:.4em;letter-spacing:.3em;opacity:.85}
#titleScr .btns{display:flex;flex-direction:column;gap:.8em;margin-top:2em;width:min(20em,80%)}
.bigbtn{background:rgba(255,255,255,.16);border:2px solid #fff;border-radius:2em;padding:.6em 1em;font-weight:bold;transition:.15s}
.bigbtn:hover{background:#ff4f8b}
.bigbtn:disabled{opacity:.35;cursor:not-allowed}
.note{font-size:.62em;opacity:.8;margin-top:1.4em;text-align:center;line-height:1.7;max-width:36em;padding:0 1em}
#selectScr,#galScr{background:linear-gradient(#2a1650,#120d22);justify-content:flex-start;padding:2% 2% 1%;overflow:auto}
#selectScr h2,#galScr h2{margin:.3em 0}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5em,1fr));gap:.8em;width:min(70em,100%);margin:.5em 0}
.card{background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.3);border-radius:1em;padding:.4em;text-align:center;cursor:pointer;transition:.15s}
.card:hover{transform:translateY(-.2em)}
.card.sel{border-color:#ff4f8b;background:rgba(255,79,139,.25)}
.card .pt{height:7em;background:linear-gradient(#fbe3f0,#dfe9ff);border-radius:.7em;overflow:hidden}
.card .pt svg{height:100%;width:100%}
.card b{display:block;font-size:.85em;margin-top:.3em}
.tag{display:inline-block;font-size:.58em;background:#ff4f8b;border-radius:1em;padding:.05em .7em;margin:.15em .1em}
.tag.b{background:#4b7bff}
#info{width:min(70em,100%);background:rgba(0,0,0,.35);border-radius:1em;padding:.8em 1em;min-height:5em;font-size:.82em;line-height:1.7}
#selBtns{display:flex;gap:1em;margin:.6em 0 1em}
#endScr{background:rgba(10,5,25,.93);text-align:center;padding:1em}
#endScr .ty{font-size:.9em;letter-spacing:.3em;color:#ffb0cc}
#endScr h2{font-size:2em;margin:.4em 0 .8em;text-shadow:0 0 .6em #ff4f8b}
#endScr .btns{display:flex;gap:.8em;flex-wrap:wrap;justify-content:center}
#logScr{position:absolute;inset:0;background:rgba(10,5,25,.93);z-index:40;display:none;flex-direction:column;padding:3%}
#logScr.show{display:flex}
#logBody{flex:1;overflow:auto;line-height:1.7;font-size:.85em}
#logBody p{margin:.5em 0}#logBody b{color:#ff9fc4}
.gal{width:min(60em,100%);margin:.4em 0;background:rgba(255,255,255,.08);border-radius:.8em;padding:.5em .9em;font-size:.8em}
.gal span{display:inline-block;margin:.15em .5em .15em 0;padding:.05em .8em;border-radius:1em;background:rgba(255,255,255,.12)}
.gal span.ok{background:#ff4f8b}
</style>
</head>
<body>
<div id="root">

<div id="game" class="bg-class">
  <div id="hud">
    <div class="gauge" id="gLove">♥ 好感度<div class="bar"><i></i></div></div>
    <div class="gauge" id="gRival">⚠ ライバル接近<div class="bar"><i></i></div></div>
    <div class="gauge" id="gDark" style="display:none">☾ 執着度<div class="bar"><i></i></div></div>
  </div>
  <div id="menu">
    <button id="bLog">LOG</button><button id="bAuto">AUTO</button><button id="bSkip">SKIP</button><button id="bTitle">TITLE</button>
  </div>
  <div id="chara"></div>
  <div id="choices"></div>
  <div id="textbox"><div id="name"></div><div id="text"></div><div id="next">▼</div></div>
  <div id="chTitle"></div>
</div>

<div id="titleScr" class="screen show">
  <h1><small>LOVE SIMULATION NOVEL</small>秋恋ストーリー<br>―クボの文化祭―</h1>
  <div class="btns">
    <button class="bigbtn" id="tNew">はじめから</button>
    <button class="bigbtn" id="tCont">つづきから</button>
    <button class="bigbtn" id="tGal">エンディング一覧</button>
  </div>
  <p class="note">文化祭まで、あと三週間。高校二年の秋、あなたの隣にいるのは誰？<br>※登場人物は全員高校生です。全年齢向け／性的な描写はありません。<br>※どのルートにも「ライバルに心を奪われる」切ないバッドエンドがあります。</p>
</div>

<div id="selectScr" class="screen">
  <h2>ヒロイン（お相手）を選んでください</h2>
  <div id="grid"></div>
  <div id="info">キャラクターを選ぶと紹介が表示されます。</div>
  <div id="selBtns"><button class="bigbtn" id="sBack">もどる</button><button class="bigbtn" id="sStart" disabled>この人とはじめる</button></div>
</div>

<div id="galScr" class="screen">
  <h2>エンディング一覧</h2>
  <div id="galBody" style="width:100%;display:flex;flex-direction:column;align-items:center"></div>
  <button class="bigbtn" id="gBack" style="margin:.8em 0">もどる</button>
</div>

<div id="endScr" class="screen">
  <div class="ty" id="endType"></div>
  <h2 id="endTitle"></h2>
  <p class="note" id="endCount"></p>
  <div class="btns" style="margin-top:1.2em">
    <button class="bigbtn" id="eRetry">同じ人でもう一度</button>
    <button class="bigbtn" id="eSel">別の人を選ぶ</button>
    <button class="bigbtn" id="eTitle">タイトルへ</button>
  </div>
</div>

<div id="logScr"><div id="logBody"></div><button class="bigbtn" id="logClose" style="margin-top:.6em">閉じる</button></div>

</div>

<script>
'use strict';
/* ================= データ ================= */
const HEROINES={
 akiko:{name:'白石アキコ',role:'幼馴染',type:'デレデレ',desc:'隣の家に住む幼馴染。毎朝起こしに来て、お弁当まで作ってくれる甘えん坊。好き好きオーラ全開だけど、他の男子に褒められると…？',hair:'#9a5b55',eye:'#e07a8f',accent:'#ff8fab',style:'long',acc:'ribbon'},
 yui:{name:'七瀬ユイ',role:'友達（女子）',type:'ツンデレ',desc:'クラスメイトで腐れ縁。口は悪いけど世話焼きで、素直になれない女の子。サッカー部のエースに憧れているらしい。',hair:'#7b4a2a',eye:'#c0392b',accent:'#ff6b81',style:'twin',acc:'ribbon'},
 saya:{name:'一ノ瀬サヤ',role:'先輩',type:'ヤンデレ',desc:'完璧な生徒会長。優しい微笑みの裏に、底の見えない執着を隠している三年生。…あなたの木曜の行動、なぜ知っているの？',hair:'#1d1b3a',eye:'#8e44ad',accent:'#7d3c98',style:'long',acc:'',dark:true},
 mio:{name:'高坂ミオ',role:'友達の姉',type:'お姉さん系（略奪）',desc:'親友の姉で三年生。包容力のある笑顔で「弟みたい」と言うけれど、彼氏持ち。寂しそうな横顔が気になって…。',hair:'#a4693d',eye:'#a0522d',accent:'#f39c12',style:'pony',acc:'clip'},
 haruki:{name:'東雲ハルキ',role:'男友達',type:'ツンデレ',desc:'いつも一緒の親友。不器用で照れ屋、ぶっきらぼうだけど面倒見がいい。距離が近すぎて、気づけば目で追っている。',hair:'#3a3f4b',eye:'#2c3e50',accent:'#e74c3c',style:'short',boy:true},
 emily:{name:'エミリー・ウォーカー',role:'留学生（女子）',type:'ストレート系デレ',desc:'イギリスから来た留学生。日本のアニメと和菓子が大好き。思ったことは全部まっすぐ伝える、素直すぎる女の子。',hair:'#e9c46a',eye:'#3a86ff',accent:'#e63946',style:'bob',acc:'ribbon'},
 leon:{name:'レオン・ベルナール',role:'留学生（男子）',type:'クーデレ紳士',desc:'フランスから来た美術好きの留学生。物静かで礼儀正しく、ふとした言葉が詩のよう。静かな視線の先には…。',hair:'#8a7a6a',eye:'#4b7f8f',accent:'#355c7d',style:'short',boy:true},
 luna:{name:'神楽坂ルナ',role:'転入生（トランスジェンダー女子）',type:'内気・繊細',desc:'新しい学校で、自分らしく過ごしたいと願う転入生。控えめで優しく、あなたにだけそっと秘密を打ち明ける。',hair:'#4a3b78',eye:'#7b68ee',accent:'#b39ddb',style:'long',acc:'clip'}
};
const ORDER=['akiko','yui','saya','mio','haruki','emily','leon','luna'];

/* ================= 立ち絵 ================= */
function portrait(c,ex,crop){
  ex=ex||'normal';
  const skin='#ffe4d4',hair=c.hair,ac=c.accent,boy=!!c.boy,suit=boy?'#2b3050':'#394078',ec=c.eye;
  let back='';
  if(c.style==='twin')back='<path d="M54 70Q16 140 38 220Q60 200 62 150Z" fill="'+hair+'"/><path d="M146 70Q184 140 162 220Q140 200 138 150Z" fill="'+hair+'"/>';
  else if(c.style==='long')back='<path d="M52 66Q26 190 48 262L152 262Q174 190 148 66Z" fill="'+hair+'"/>';
  else if(c.style==='pony')back='<path d="M138 48Q198 84 172 180Q158 124 136 92Z" fill="'+hair+'"/>';
  else if(c.style==='bob')back='<path d="M50 70Q40 146 60 156L140 156Q160 146 150 70Z" fill="'+hair+'"/>';
  const body='<path d="M26 300Q30 190 100 172Q170 190 174 300Z" fill="'+suit+'"/><path d="M80 174L100 218L120 174Z" fill="#fff"/>'+
    (boy?'<path d="M95 182L105 182L109 238L100 248L91 238Z" fill="'+ac+'"/>':'<path d="M100 194L76 182L78 212ZM100 194L124 182L122 212Z" fill="'+ac+'"/><circle cx="100" cy="195" r="6" fill="'+ac+'"/>');
  const neck='<rect x="87" y="136" width="26" height="40" rx="10" fill="#f6d2bc"/>';
  const head='<ellipse cx="100" cy="94" rx="46" ry="52" fill="'+skin+'"/>';
  const front=boy?'<path d="M52 96Q42 34 100 32Q158 34 148 96Q142 64 120 60Q112 76 98 62Q84 80 68 62Q56 70 52 96Z" fill="'+hair+'"/>':
    '<path d="M52 100Q42 32 100 30Q158 32 148 100Q142 68 120 62Q106 84 88 62Q62 72 52 100Z" fill="'+hair+'"/>';
  let acc='';
  if(c.acc==='ribbon')acc='<path d="M136 44L160 34L158 62ZM136 44L118 32L116 60Z" fill="'+ac+'"/>';
  if(c.acc==='clip')acc='<rect x="58" y="52" width="26" height="7" rx="3.5" fill="'+ac+'" transform="rotate(-24 71 55)"/>';
  const eye=(x,rx,ry)=>'<ellipse cx="'+x+'" cy="100" rx="'+rx+'" ry="'+ry+'" fill="#fff"/><ellipse cx="'+x+'" cy="101" rx="'+(rx-2)+'" ry="'+(ry-1.5)+'" fill="'+ec+'"/><circle cx="'+x+'" cy="102" r="'+(rx-5)+'" fill="#222"/><circle cx="'+(x-2.5)+'" cy="97" r="2.4" fill="#fff"/>';
  const closed=x=>'<path d="M'+(x-9)+' 102Q'+x+' 91 '+(x+9)+' 102" stroke="#4a2f2a" stroke-width="3" fill="none" stroke-linecap="round"/>';
  const brow=(a,b)=>'<path d="'+a+'" stroke="#4a2f2a" stroke-width="3" fill="none" stroke-linecap="round"/><path d="'+b+'" stroke="#4a2f2a" stroke-width="3" fill="none" stroke-linecap="round"/>';
  const ml=d=>'<path d="'+d+'" stroke="#b5483c" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
  let eyes,brows='',mouth,extra='';
  switch(ex){
    case 'smile':eyes=closed(80)+closed(120);mouth='<path d="M88 120Q100 134 112 120Z" fill="#fff" stroke="#b5483c" stroke-width="2.5"/>';break;
    case 'blush':eyes=eye(80,8,11)+eye(120,8,11);brows=brow('M70 84Q80 79 90 83','M110 83Q120 79 130 84');mouth=ml('M92 122Q100 128 108 122');extra='<ellipse cx="66" cy="114" rx="11" ry="6" fill="#ff7b95" opacity=".5"/><ellipse cx="134" cy="114" rx="11" ry="6" fill="#ff7b95" opacity=".5"/>';break;
    case 'angry':eyes=eye(80,8,10)+eye(120,8,10);brows=brow('M68 76L92 85','M132 76L108 85');mouth=ml('M91 127Q100 119 109 127');extra='<path d="M146 62l6-6M152 62l-6-6" stroke="#e74c3c" stroke-width="3"/>';break;
    case 'sad':eyes=eye(80,8,11)+eye(120,8,11);brows=brow('M68 86L92 79','M132 86L108 79');mouth=ml('M91 127Q100 119 109 127');extra='<path d="M70 112Q66 122 71 126Q76 120 70 112Z" fill="#8fd3ff"/>';break;
    case 'surprised':eyes=eye(80,9,13)+eye(120,9,13);brows=brow('M70 80Q80 72 90 79','M110 79Q120 72 130 80');mouth='<ellipse cx="100" cy="125" rx="5" ry="7" fill="#9b3a3a"/>';break;
    case 'dark':eyes='<ellipse cx="80" cy="100" rx="8" ry="11" fill="#fff"/><ellipse cx="80" cy="101" rx="7.5" ry="10.5" fill="'+ec+'"/><ellipse cx="120" cy="100" rx="8" ry="11" fill="#fff"/><ellipse cx="120" cy="101" rx="7.5" ry="10.5" fill="'+ec+'"/>';brows=brow('M70 83Q80 80 90 84','M110 84Q120 80 130 83');mouth='<path d="M82 118Q100 142 118 118Z" fill="#fff" stroke="#b5483c" stroke-width="2.5"/>';extra='<rect x="60" y="84" width="80" height="12" fill="#000" opacity=".14"/>';break;
    default:eyes=eye(80,8,11)+eye(120,8,11);brows=brow('M70 84Q80 79 90 83','M110 83Q120 79 130 84');mouth=ml('M92 122Q100 126 108 122');
  }
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="'+(crop?'28 14 144 150':'0 0 200 300')+'">'+back+body+neck+head+eyes+brows+mouth+extra+front+acc+'</svg>';
}

/* ================= シナリオ ================= */
// 行形式: 'n|地の文' 'k|クボ' 'h|表情|ヒロイン' 'r|ライバル' 't|名前|第三者' 'bg|背景'
const o=(t,l,r,d,...a)=>({t,l,r,d,a});
const Q=(...x)=>({q:x});

/* ================= エンジン ================= */
const $=s=>document.querySelector(s);
const TYPES={true:'HAPPY END',normal:'NORMAL END',ntr:'BAD END — 奪われた',dark:'DARK END — ヤンデレ'};
let G=null,busy=false,typingT=null,autoT=null,curText='',auto=false,skip=false,choosing=false,selId=null,lastHeroine=null;
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('show'));if(id)$('#'+id).classList.add('show');}
function setBg(b,noFlash){$('#game').className='bg-'+b;if(!noFlash){$('#game').classList.add('flash');setTimeout(()=>$('#game').classList.remove('flash'),650)}}
function renderChara(ex){G.expr=ex;$('#chara').innerHTML=portrait(HEROINES[G.h],ex);}
function hud(pop){
  $('#gLove i').style.width=Math.min(G.love/12,1)*100+'%';
  $('#gRival i').style.width=Math.min(G.rival/8,1)*100+'%';
  $('#gDark i').style.width=Math.min(G.dark/4,1)*100+'%';
  if(pop)['#gLove','#gRival','#gDark'].forEach(s=>{$(s).classList.remove('pop');void $(s).offsetWidth;$(s).classList.add('pop')});
}

/* --- ゲーム開始 --- */
function newGame(h){
  G={h,love:0,rival:0,dark:0,ch:0,q:[],expr:'normal',log:[]};
  lastHeroine=h;startChapter(0);
}
function startChapter(i){
  const R=ROUTES[G.h];
  G.ch=i;G.love=G.love||0;
  LS.set('akikoi_save',{h:G.h,love:G.love,rival:G.rival,dark:G.dark,ch:i});
  show(null);
  $('#gDark').style.display=HEROINES[G.h].dark?'flex':'none';
  if(i>=R.ch.length){finishRoute();return}
  const c=R.ch[i];
  setBg(c.bg,true);renderChara('normal');hud();
  $('#textbox').style.visibility='hidden';
  G.q=c.l.slice();
  const t=$('#chTitle');t.textContent=c.title;t.classList.add('show');
  let done=false;const go=()=>{if(done)return;done=true;t.classList.remove('show');$('#textbox').style.visibility='visible';runLine()};
  t.onclick=e=>{e.stopPropagation();go()};
  setTimeout(go,2000);
}
function resumeGame(){
  const s=LS.get('akikoi_save',null);if(!s||!ROUTES[s.h])return;
  G={h:s.h,love:s.love,rival:s.rival,dark:s.dark||0,ch:s.ch,q:[],expr:'normal',log:[]};
  lastHeroine=s.h;startChapter(s.ch);
}

/* --- 1行ずつ実行 --- */
function runLine(){
  clearTimeout(autoT);
  const it=G.q.shift();
  if(it===undefined){startChapter(G.ch+1);return}
  if(typeof it==='object'){showChoices(it.q);return}
  const p=it.split('|'),R=ROUTES[G.h],H=HEROINES[G.h];
  switch(p[0]){
    case 'bg':setBg(p[1]);runLine();return;
    case 'n':say('',p[1],'');return;
    case 'k':say('クボ',p[1],'k');return;
    case 'h':renderChara(p[1]);$('#chara').classList.remove('talk');void $('#chara').offsetWidth;$('#chara').classList.add('talk');say(H.name,p[2],'h');return;
    case 'r':say(R.rival,p[1],'r');return;
    case 't':say(p[1],p[2],'t');return;
    case 'end':doEnd(p[1]);return;
    default:runLine();
  }
}
function say(name,text,cls){
  const nm=$('#name');
  nm.textContent=name;nm.style.display=name?'block':'none';nm.className=cls;
  if(cls==='h')nm.style.background=HEROINES[G.h].accent;else nm.style.background='';
  curText=text;G.log.push({name,text});
  $('#text').textContent='';$('#next').style.visibility='hidden';
  busy=true;let i=0;clearInterval(typingT);
  if(skip){finishText();return}
  typingT=setInterval(()=>{i++;$('#text').textContent=text.slice(0,i);if(i>=text.length)finishText()},24);
}
function finishText(){
  clearInterval(typingT);$('#text').textContent=curText;busy=false;$('#next').style.visibility='visible';
  clearTimeout(autoT);
  if(skip)autoT=setTimeout(advance,70);
  else if(auto)autoT=setTimeout(advance,1200+curText.length*55);
}
function advance(){
  if(choosing||!G||$('#chTitle').classList.contains('show'))return;
  if(busy){finishText();return}
  runLine();
}
function showChoices(opts){
  choosing=true;skip=false;$('#bSkip').classList.remove('on');
  const box=$('#choices');box.innerHTML='';
  opts.forEach(op=>{
    const b=document.createElement('button');b.textContent=op.t;
    b.onclick=e=>{
      e.stopPropagation();
      G.love+=op.l;G.rival+=op.r;G.dark+=op.d;hud(true);
      G.log.push({name:'▶選択',text:op.t});
      box.classList.remove('show');choosing=false;
      G.q.unshift(...op.a);runLine();
    };
    box.appendChild(b);
  });
  box.classList.add('show');
}

/* --- エンディング --- */
function calcEnd(){
  const R=ROUTES[G.h];
  if(R.darkEnd&&G.dark>=3&&G.love>=8)return 'dark';
  if(G.rival>=5&&G.love<9)return 'ntr';
  if(G.love>=8)return 'true';
  return 'normal';
}
function finishRoute(){
  const k=calcEnd(),e=ROUTES[G.h].end[k];
  G.q=e.l.slice();G.q.push('end|'+k);
  setBg(k==='ntr'?'sunset':k==='dark'?'night':'festnight');
  renderChara(k==='dark'?'dark':k==='ntr'?'smile':k==='true'?'blush':'normal');
  $('#textbox').style.visibility='visible';runLine();
}
function doEnd(k){
  const e=ROUTES[G.h].end[k];
  const got=LS.get('akikoi_end',{});got[G.h+':'+k]=1;LS.set('akikoi_end',got);
  try{localStorage.removeItem('akikoi_save')}catch(x){}
  $('#endType').textContent=TYPES[k];
  $('#endTitle').textContent='「'+e.t+'」';
  const total=Object.keys(ROUTES).reduce((n,id)=>n+Object.keys(ROUTES[id].end).length,0);
  $('#endCount').textContent=HEROINES[G.h].name+'ルート　／　回収済みエンディング '+Object.keys(got).length+' / '+total+'\n（好感度 '+G.love+'・ライバル '+G.rival+(HEROINES[G.h].dark?'・執着 '+G.dark:'')+'）';
  show('endScr');
}

/* --- ギャラリー --- */
function renderGal(){
  const got=LS.get('akikoi_end',{}),body=$('#galBody');body.innerHTML='';
  ORDER.forEach(id=>{
    const d=document.createElement('div');d.className='gal';
    let h='<b>'+HEROINES[id].name+'</b>（'+HEROINES[id].role+'）<br>';
    Object.keys(ROUTES[id].end).forEach(k=>{
      const ok=got[id+':'+k];
      h+='<span class="'+(ok?'ok':'')+'">'+(ok?ROUTES[id].end[k].t:'？？？')+'</span>';
    });
    d.innerHTML=h;body.appendChild(d);
  });
}

/* --- ヒロイン選択 --- */
function buildSelect(){
  const g=$('#grid');g.innerHTML='';selId=null;$('#sStart').disabled=true;
  $('#info').textContent='キャラクターを選ぶと紹介が表示されます。';
  ORDER.forEach(id=>{
    const H=HEROINES[id],c=document.createElement('div');c.className='card';
    c.innerHTML='<div class="pt">'+portrait(H,'smile',true)+'</div><b>'+H.name+'</b><span class="tag b">'+H.role+'</span><span class="tag">'+H.type+'</span>';
    c.onclick=()=>{
      document.querySelectorAll('.card').forEach(x=>x.classList.remove('sel'));c.classList.add('sel');
      selId=id;$('#sStart').disabled=false;
      $('#info').innerHTML='<b>'+H.name+'</b>　<span class="tag b">'+H.role+'</span><span class="tag">'+H.type+'</span><br>'+H.desc;
    };
    g.appendChild(c);
  });
}

/* --- 入力・UI --- */
$('#game').addEventListener('click',advance);
document.addEventListener('keydown',e=>{
  if(!$('#game')||document.querySelector('.screen.show')||$('#logScr').classList.contains('show'))return;
  if(e.key===' '||e.key==='Enter'){e.preventDefault();advance()}
});
$('#menu').addEventListener('click',e=>e.stopPropagation());
$('#bAuto').onclick=()=>{auto=!auto;skip=false;$('#bAuto').classList.toggle('on',auto);$('#bSkip').classList.remove('on');if(auto&&!busy&&!choosing)finishText()};
$('#bSkip').onclick=()=>{skip=!skip;auto=false;$('#bSkip').classList.toggle('on',skip);$('#bAuto').classList.remove('on');if(skip&&!choosing)advance()};
$('#bLog').onclick=()=>{
  $('#logBody').innerHTML=(G?G.log:[]).slice(-80).map(l=>'<p>'+(l.name?'<b>'+l.name+'</b>　':'')+l.text.replace(/</g,'&lt;')+'</p>').join('');
  $('#logScr').classList.add('show');$('#logBody').scrollTop=1e6;
};
$('#logClose').onclick=()=>$('#logScr').classList.remove('show');
$('#bTitle').onclick=()=>{if(confirm('タイトルへ戻りますか？（進行状況はチャプター開始時点で自動保存されています）')){auto=skip=false;$('#bAuto').classList.remove('on');$('#bSkip').classList.remove('on');toTitle()}};
function toTitle(){clearTimeout(autoT);clearInterval(typingT);choosing=false;$('#choices').classList.remove('show');$('#tCont').disabled=!LS.get('akikoi_save',null);show('titleScr')}
$('#tNew').onclick=()=>{buildSelect();show('selectScr')};
$('#tCont').onclick=resumeGame;
$('#tGal').onclick=()=>{renderGal();show('galScr')};
$('#gBack').onclick=toTitle;
$('#sBack').onclick=toTitle;
$('#sStart').onclick=()=>{if(selId)newGame(selId)};
$('#eRetry').onclick=()=>newGame(lastHeroine);
$('#eSel').onclick=()=>{buildSelect();show('selectScr')};
$('#eTitle').onclick=toTitle;
toTitle();
</script>
